<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barkly — set up</title>
<link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <!--
    The whole page lives inside this <template>. boot.js clones it into #mount
    before calling initOnboarding(). src/onboarding/test.html fetches this same
    file and clones the template too, so production and tests always run the
    exact same markup (never a hand-duplicated copy that can drift).
  -->
  <template id="onboardTemplate">
    <main class="card" id="onboardRoot">
      <header class="head">
        <div class="brand"><span class="mascot" aria-hidden="true">🐶</span> Grammy</div>
        <p class="sub">Your Instagram assistant. Three quick steps.</p>
      </header>

      <div class="dots" id="dots" aria-hidden="true">
        <span class="dot" data-dot="1"></span>
        <span class="dot" data-dot="2"></span>
        <span class="dot" data-dot="3"></span>
      </div>

      <div class="viewport" id="stepViewport">
        <section class="step" data-step="1" id="step1">
          <h2>Pick a persona</h2>
          <p class="hint">You can switch this anytime from the chat menu.</p>
          <div class="persona-cards">
            <button type="button" class="persona-card" id="personaCasual" data-persona="casual" aria-pressed="false">
              <span class="persona-title">Casual</span>
              <span class="persona-desc">Talks like a friend. Explains what's on screen in plain words.</span>
            </button>
            <button type="button" class="persona-card" id="personaInfluencer" data-persona="influencer" aria-pressed="false">
              <span class="persona-title">Influencer</span>
              <span class="persona-desc">Analytical and data-driven. Cites the numbers it can see and ends with recommendations.</span>
            </button>
          </div>
        </section>

        <section class="step" data-step="2" id="step2" hidden>
          <h2>Microphone</h2>
          <p class="hint">Grant it once here so push-to-talk works on Instagram.</p>
          <button type="button" class="btn" id="micGrantBtn">Grant microphone</button>
          <p class="mic-status" id="micStatus" data-state="idle">Not requested yet.</p>
          <button type="button" class="link" id="micSkipBtn">Skip for now — you can type instead</button>
        </section>

        <section class="step" data-step="3" id="step3" hidden>
          <h2>API key</h2>
          <div class="key-row">
            <input type="password" id="apiKeyInput" placeholder="sk-…" autocomplete="off" spellcheck="false">
            <button type="button" class="link" id="toggleKeyBtn">Show</button>
          </div>
          <p class="helper">Your OpenAI API key. It stays in this browser (chrome.storage) and is only sent to api.openai.com.</p>
          <p class="key-reminder" id="keyReminder">Grammy can't answer anything until a valid key is saved here.</p>
          <button type="button" class="btn" id="testKeyBtn">Test key</button>
          <p class="test-result" id="testKeyResult"></p>
        </section>
      </div>

      <nav class="nav-row" id="navRow">
        <button type="button" class="btn btn-secondary" id="backBtn" hidden>Back</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-primary" id="nextBtn">Next</button>
        <button type="button" class="btn btn-primary" id="doneBtn" hidden>Done</button>
      </nav>

      <p class="status-line" id="statusLine" role="status"></p>

      <section class="summary" id="summaryView" hidden>
        <h2>You're set up</h2>
        <div class="summary-row">
          <span>Persona: <strong id="summaryPersona">—</strong></span>
          <button type="button" class="link" data-change="1">Change</button>
        </div>
        <div class="summary-row">
          <span>Microphone: <strong id="summaryMic">—</strong></span>
          <button type="button" class="link" data-change="2">Change</button>
        </div>
        <div class="summary-row">
          <span>API key: <strong id="summaryKey">—</strong></span>
          <button type="button" class="link" data-change="3">Change</button>
        </div>
        <button type="button" class="btn btn-primary" id="summaryCloseBtn">Close</button>
      </section>

      <p class="close-fallback" id="closeFallback" hidden>All set — you can close this tab and go back to Instagram.</p>
    </main>
  </template>

  <div id="mount"></div>

  <script type="module" src="boot.js"></script>
</body>
</html>
