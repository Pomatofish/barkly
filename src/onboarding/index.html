<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammy — set up</title>
<link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <main class="card">
    <h1>🐶 Grammy</h1>
    <p class="sub">Your Instagram assistant. Three quick steps. (Placeholder — the onboarding module fills this in.)</p>

    <section>
      <h2>1. Pick a persona</h2>
      <label><input type="radio" name="persona" value="casual" checked> Casual — talks like a friend, explains what is on screen</label>
      <label><input type="radio" name="persona" value="influencer"> Influencer — analytical, cites the numbers, ends with recommendations</label>
    </section>

    <section>
      <h2>2. Microphone</h2>
      <button id="mic" type="button">Grant microphone</button>
      <span id="micState" class="muted">not requested</span>
    </section>

    <section>
      <h2>3. API key</h2>
      <input id="key" type="password" placeholder="sk-…" autocomplete="off">
    </section>

    <button id="done" class="primary" type="button">Done</button>
    <p id="note" class="muted"></p>
  </main>
  <script type="module" src="onboarding.js"></script>
</body>
</html>
